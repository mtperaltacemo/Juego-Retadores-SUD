<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retadores SUD — En vivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-database-compat.js"></script>
<style>
  :root {
    --bg-red: #0B3D66;
    --bg-red-deep: #041B2E;
    --panel: #0A2033;
    --panel-2: #051422;
    --blue: #3E8FC4;
    --blue-dim: #245C86;
    --blue-light: #7FD4E6;
    --text: #F3FBFF;
    --muted: #B7C9D6;
    --danger: #FF6A4D;
    --good: #46C98A;
    --yellow: #F2B705;
    --cat-red: #2158C4;
    --cat-yellow: #DDA92E;
    --cat-blue: #17A2B8;
    --cat-orange: #F2994A;
    --cat-green: #379654;
    --radius: 14px;
    --ice: #EFF6F8;
    --ink-soft: #4E6577;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:var(--ice); color:var(--text); font-family:'Inter',sans-serif; min-height:100vh; }
  body {
    background-color:var(--ice);
    background-image:
      radial-gradient(circle at 12% 6%, rgba(62,143,196,0.12), transparent 45%),
      radial-gradient(circle at 90% 95%, rgba(55,150,84,0.08), transparent 48%);
    display:flex; justify-content:center; padding:24px 16px 50px;
  }
  .app { width:100%; max-width:480px; }
  h1,h2,h3 { font-family:'Space Grotesk',sans-serif; margin:0; }
  .hidden { display:none !important; }

  .topbar { display:flex; align-items:center; justify-content:center; margin-bottom:14px; }
  .brand-logo img { height:36px; width:auto; display:block; filter:drop-shadow(0 2px 6px rgba(18,59,99,0.18)); }

  .page-title {
    font-family:'Bebas Neue',sans-serif; font-size:28px; font-weight:400;
    letter-spacing:.04em; line-height:1; text-transform:uppercase; color:var(--bg-red);
    text-align:center; margin:0;
  }
  .page-subtitle {
    font-family:'Space Grotesk',sans-serif; font-size:12.5px; font-weight:600;
    letter-spacing:.08em; text-transform:uppercase; color:var(--blue-dim);
    text-align:center; margin:6px 0 20px;
  }
  .live-pill {
    display:inline-flex; align-items:center; gap:6px; background:var(--danger); color:#fff;
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:11px; letter-spacing:.06em;
    padding:4px 10px; border-radius:999px; margin:0 auto 14px; text-transform:uppercase;
  }
  .live-dot { width:7px; height:7px; border-radius:50%; background:#fff; animation:pulse 1.2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.35;} }
  .live-pill-wrap { display:flex; justify-content:center; }

  .card { background:var(--panel); border:1px solid rgba(255,255,255,0.06); border-radius:var(--radius); padding:24px; margin-bottom:16px; }
  .muted { color:var(--muted); }

  label { display:block; font-size:13px; color:var(--muted); margin-bottom:6px; font-weight:500; }
  input[type="text"] {
    width:100%; background:var(--panel-2); border:1px solid rgba(255,255,255,0.08); color:var(--text);
    padding:13px 14px; border-radius:10px; font-size:15px; font-family:inherit;
  }
  input[type="text"]:focus { outline:2px solid var(--blue-light); outline-offset:1px; }

  button.primary {
    background:var(--bg-red); color:#FFFFFF; border:none; font-weight:700; font-family:'Space Grotesk',sans-serif;
    font-size:15px; padding:14px 22px; border-radius:10px; cursor:pointer; width:100%;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  button.primary:hover:not(:disabled) { transform:translateY(-1px); background:var(--blue-dim); }
  button.primary:disabled { opacity:.4; cursor:not-allowed; transform:none; }

  .status-box { text-align:center; padding:30px 10px; }
  .status-icon { font-size:40px; margin-bottom:10px; }
  .status-text { font-size:16px; font-weight:600; line-height:1.5; }
  .status-sub { font-size:13px; color:var(--muted); margin-top:8px; }

  .score-strip {
    display:flex; justify-content:space-between; align-items:center;
    background:var(--panel-2); border-radius:10px; padding:12px 16px; margin-bottom:14px;
    font-size:13px; color:var(--muted);
  }
  .score-strip b { color:var(--good); font-size:18px; font-family:'Space Grotesk',sans-serif; }

  .quiz-cat-label { font-size:11.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--blue-light); font-weight:700; margin-bottom:6px; text-align:center; }
  .question-text { font-size:19px; font-weight:700; line-height:1.4; margin:4px 0 20px; font-family:'Space Grotesk',sans-serif; text-align:center; }

  .options { display:grid; gap:12px; }
  .option-btn {
    text-align:left; background:var(--panel-2); border:2px solid rgba(255,255,255,0.08); color:var(--text);
    padding:16px 16px; border-radius:12px; font-size:16px; font-family:inherit; cursor:pointer;
    display:flex; align-items:center; gap:12px; transition:border-color .15s ease, background .15s ease, transform .1s ease;
  }
  .option-btn:hover:not(:disabled) { border-color:var(--blue-light); transform:translateY(-1px); }
  .option-btn:active:not(:disabled) { transform:scale(0.98); }
  .option-btn:disabled { cursor:not-allowed; opacity:.45; }
  .option-btn.chosen { border-color:var(--good); background:rgba(79,201,138,0.15); opacity:1; }
  .option-letter { width:28px; height:28px; border-radius:7px; background:rgba(255,255,255,0.08); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; flex-shrink:0; }

  .result-banner { text-align:center; padding:26px 10px; }
  .result-icon { font-size:46px; margin-bottom:8px; }
  .result-title { font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:20px; }
  .result-sub { font-size:13.5px; color:var(--muted); margin-top:6px; }
  .result-title.good { color:var(--good); }
  .result-title.bad { color:var(--danger); }
  .result-title.neutral { color:var(--blue-light); }

  .err-box { background:rgba(255,106,77,0.12); border:1px solid var(--danger); border-radius:10px; padding:12px 14px; font-size:13px; color:var(--text); margin-bottom:14px; }
</style>
</head>

<script>
/* ============================================================
   CONFIGURACIÓN DE FIREBASE
   Reemplazá estos valores por los de tu propio proyecto Firebase
   (Configuración del proyecto → Tus apps → SDK de Firebase).
   Este archivo y en-vivo-anfitrion.html deben tener EXACTAMENTE
   el mismo FIREBASE_CONFIG.
   ============================================================ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBuv_XlaKYrlM-hlwV30aBJJx9RrxIsj_I",
  authDomain: "retadores-sud.firebaseapp.com",
  databaseURL: "https://retadores-sud-default-rtdb.firebaseio.com",
  projectId: "retadores-sud",
  storageBucket: "retadores-sud.firebasestorage.app",
  messagingSenderId: "932109276430",
  appId: "1:932109276430:web:cdac9350d0ba162ecbf35f"
};

/* ============================================================
   ADAPTADOR DE BASE DE DATOS EN TIEMPO REAL
   - Producción: Firebase Realtime Database.
   - Pruebas (agregando ?mock=1 a la URL): localStorage + eventos,
     funciona solo entre pestañas del mismo navegador. Sirve para
     probar la lógica del juego sin necesitar un proyecto Firebase
     real todavía.
   ============================================================ */
function isMockMode() {
  return new URLSearchParams(location.search).get('mock') === '1';
}

function createFirebaseDb() {
  firebase.initializeApp(FIREBASE_CONFIG);
  // Las reglas de la base de datos son publicas (no requieren haber iniciado sesion),
  // asi que la app tiene que funcionar igual haya o no una sesion anonima activa.
  // Se intenta iniciar sesion anonima en segundo plano (por si en el futuro se
  // ajustan las reglas para requerirlo), pero NUNCA se bloquea ni se rompe la app
  // si ese intento falla (por ejemplo, si el proveedor "Anonymous" no esta
  // habilitado en el proyecto de Firebase).
  const readyPromise = new Promise((resolve) => {
    let settled = false;
    const settle = () => { if (!settled) { settled = true; resolve(); } };
    firebase.auth().onAuthStateChanged(() => settle());
    firebase.auth().signInAnonymously().catch((err) => {
      console.warn('Inicio de sesion anonimo no disponible (no es necesario, se continua igual):', err);
      settle();
    });
    setTimeout(settle, 3000); // red de seguridad para no quedar esperando para siempre
  });
  const db = firebase.database();
  return {
    ready: readyPromise,
    ref(path) {
      const r = db.ref(path);
      return {
        set: (v) => r.set(v),
        update: (v) => r.update(v),
        remove: () => r.remove(),
        once: () => r.once('value').then(s => s.val()),
        onValue: (cb) => { const h = (s) => cb(s.val()); r.on('value', h); return () => r.off('value', h); },
        transaction: (fn) => r.transaction(fn).then(res => ({ committed: res.committed, snapshot: res.snapshot ? res.snapshot.val() : null })),
      };
    }
  };
}

function createMockDb() {
  // Todo el estado del mock se guarda como UN solo árbol JSON en localStorage,
  // igual que Firebase Realtime Database: un listener sobre una ruta "padre"
  // (ej. "liveGames/CODE") recibe automáticamente el árbol combinado de todos
  // sus hijos (players, question, meta), no solo lo que se escribió en esa ruta exacta.
  const ROOT_KEY = 'mockdb:root';
  const LOCK = 'mockdb:global-lock';
  const listeners = {}; // path -> Set<callback>

  function readRoot() {
    try { return JSON.parse(localStorage.getItem(ROOT_KEY)) || {}; } catch (e) { return {}; }
  }
  function writeRoot(root) { localStorage.setItem(ROOT_KEY, JSON.stringify(root)); }
  function splitPath(path) { return path ? path.split('/').filter(Boolean) : []; }
  function getAtPath(root, parts) {
    let cur = root;
    for (const p of parts) {
      if (cur == null || typeof cur !== 'object') return null;
      cur = cur[p];
    }
    return cur === undefined ? null : cur;
  }
  function setAtPath(root, parts, value) {
    if (!parts.length) return (value === null || value === undefined) ? {} : value;
    const newRoot = (root && typeof root === 'object') ? Object.assign({}, root) : {};
    let cur = newRoot;
    for (let i = 0; i < parts.length - 1; i++) {
      const key = parts[i];
      const existing = cur[key];
      const cloned = (existing && typeof existing === 'object') ? Object.assign({}, existing) : {};
      cur[key] = cloned;
      cur = cloned;
    }
    const lastKey = parts[parts.length - 1];
    if (value === null || value === undefined) delete cur[lastKey];
    else cur[lastKey] = value;
    return newRoot;
  }
  function notifyAll() {
    const root = readRoot();
    Object.keys(listeners).forEach(path => {
      const val = getAtPath(root, splitPath(path));
      (listeners[path] || new Set()).forEach(cb => cb(val));
    });
  }
  window.addEventListener('storage', (e) => {
    if (e.key !== ROOT_KEY) return;
    notifyAll();
  });
  function withLock(fn) { return navigator.locks.request(LOCK, fn); }

  return {
    ready: Promise.resolve(),
    ref(path) {
      const parts = splitPath(path);
      return {
        set: (v) => withLock(async () => {
          writeRoot(setAtPath(readRoot(), parts, v));
          notifyAll();
        }),
        update: (v) => withLock(async () => {
          const root = readRoot();
          const cur = getAtPath(root, parts);
          const merged = Object.assign({}, (cur && typeof cur === 'object') ? cur : {}, v);
          writeRoot(setAtPath(root, parts, merged));
          notifyAll();
        }),
        remove: () => withLock(async () => {
          writeRoot(setAtPath(readRoot(), parts, null));
          notifyAll();
        }),
        once: () => withLock(async () => getAtPath(readRoot(), parts)),
        onValue: (cb) => {
          if (!listeners[path]) listeners[path] = new Set();
          listeners[path].add(cb);
          cb(getAtPath(readRoot(), parts));
          return () => listeners[path].delete(cb);
        },
        transaction: (fn) => withLock(async () => {
          const root = readRoot();
          const current = getAtPath(root, parts);
          const next = fn(current);
          if (next === undefined) return { committed: false, snapshot: current };
          writeRoot(setAtPath(root, parts, next));
          notifyAll();
          return { committed: true, snapshot: next };
        }),
      };
    }
  };
}

const DB = isMockMode() ? createMockDb() : createFirebaseDb();

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}
function randomId() {
  return 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

/* ============================================================
   ESTADO
   ============================================================ */
const params = new URLSearchParams(location.search);
const GAME_CODE = (params.get('g') || '').toUpperCase().trim();
let player = null; // { id, name }
let unsubQuestion = null;
let unsubPlayer = null;
let currentQ = null;

const screens = {
  join: document.getElementById('screenJoin'),
  waiting: document.getElementById('screenWaiting'),
  question: document.getElementById('screenQuestion'),
  locked: document.getElementById('screenLocked'),
  result: document.getElementById('screenResult'),
};
function showScreen(name) {
  Object.values(screens).forEach(s => s.classList.add('hidden'));
  screens[name].classList.remove('hidden');
}
function showError(msg) {
  const box = document.getElementById('errBanner');
  box.textContent = msg;
  box.classList.remove('hidden');
}

document.getElementById('joinCodeLabel').textContent = GAME_CODE || '----';

if (!GAME_CODE) {
  showError('Este link no tiene un código de partida válido. Pedile al anfitrión el link correcto.');
  document.getElementById('joinBtn').disabled = true;
}

document.getElementById('playerNameInput').addEventListener('input', e => {
  const pos = e.target.selectionStart;
  e.target.value = e.target.value.toUpperCase();
  e.target.setSelectionRange(pos, pos);
});
document.getElementById('playerNameInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); document.getElementById('joinBtn').click(); }
});

document.getElementById('joinBtn').addEventListener('click', joinGame);

async function joinGame() {
  const name = document.getElementById('playerNameInput').value.trim();
  if (!name) { document.getElementById('playerNameInput').focus(); return; }
  if (!GAME_CODE) return;

  const joinBtn = document.getElementById('joinBtn');
  joinBtn.disabled = true;
  try {
    await DB.ready;

    // Se usa sessionStorage (no localStorage) para recordar la identidad del jugador:
    // así cada pestaña/dispositivo tiene su propia identidad aislada, pero si esa
    // misma pestaña se refresca sigue siendo reconocida como el mismo participante.
    const storageKey = 'liveplayer:' + GAME_CODE;
    let saved = null;
    try { saved = JSON.parse(sessionStorage.getItem(storageKey)); } catch (e) {}

    const playerId = (saved && saved.id) || randomId();
    player = { id: playerId, name };
    sessionStorage.setItem(storageKey, JSON.stringify(player));

    const playersRef = DB.ref('liveGames/' + GAME_CODE + '/players/' + playerId);
    await playersRef.update({ name, joinedAt: Date.now() });
    // el puntaje solo se inicializa si todavía no existe (caso: el jugador vuelve a entrar)
    const existing = await playersRef.once();
    if (!existing || typeof existing.score !== 'number') {
      await playersRef.update({ score: 0 });
    }

    unsubPlayer = playersRef.onValue(data => {
      const score = data && typeof data.score === 'number' ? data.score : 0;
      document.getElementById('waitScore').textContent = score;
      document.getElementById('qScore').textContent = score;
      document.getElementById('lkScore').textContent = score;
      document.getElementById('rScore').textContent = score;
    });
    [ 'waitPlayerName', 'qPlayerName', 'lkPlayerName', 'rPlayerName' ].forEach(id => {
      document.getElementById(id).textContent = name;
    });

    const qRef = DB.ref('liveGames/' + GAME_CODE + '/question');
    unsubQuestion = qRef.onValue(handleQuestionUpdate);
  } catch (err) {
    console.error('Error al entrar a la partida:', err);
    showError('No se pudo conectar con la partida. Revisá tu conexión a internet e intentá de nuevo. Detalle: ' + (err && err.message ? err.message : err));
    joinBtn.disabled = false;
  }
}

let lastHandledQId = null;
let myLockAttemptQId = null;

function handleQuestionUpdate(q) {
  currentQ = q;
  if (!q || q.status === 'idle') {
    showScreen('waiting');
    return;
  }

  const failed = q.failedPlayers && q.failedPlayers[player.id];

  if (q.status === 'open') {
    if (failed) {
      // ya lo intentó y falló en esta pregunta: espera a que otro acierte o termine
      showScreen('locked');
      document.getElementById('lockedBox').querySelector('.status-icon').textContent = '⌛';
      document.getElementById('lockedText').textContent = 'Ya respondiste esta pregunta';
      document.getElementById('lockedSub').textContent = 'Esperá a ver si alguien más acierta.';
      return;
    }
    renderQuestionScreen(q);
    return;
  }

  if (q.status === 'locked') {
    if (q.lockedBy && q.lockedBy.playerId === player.id) {
      showScreen('locked');
      document.getElementById('lockedBox').querySelector('.status-icon').textContent = '🖐️';
      document.getElementById('lockedText').textContent = '¡Tocaste primero!';
      document.getElementById('lockedSub').textContent = 'Esperando la confirmación del anfitrión...';
    } else if (failed) {
      showScreen('locked');
      document.getElementById('lockedBox').querySelector('.status-icon').textContent = '⌛';
      document.getElementById('lockedText').textContent = 'Ya respondiste esta pregunta';
      document.getElementById('lockedSub').textContent = 'Esperá a ver si alguien más acierta.';
    } else {
      showScreen('locked');
      document.getElementById('lockedBox').querySelector('.status-icon').textContent = '🚫';
      document.getElementById('lockedText').textContent = 'Otro participante respondió primero';
      document.getElementById('lockedSub').textContent = 'Esperá el resultado...';
    }
    return;
  }

  if (q.status === 'resolved_correct') {
    const iWon = q.resolvedWinner && q.resolvedWinner.playerId === player.id;
    showScreen('result');
    document.getElementById('rIcon').textContent = iWon ? '🏆' : '✅';
    const title = document.getElementById('rTitle');
    title.className = 'result-title ' + (iWon ? 'good' : 'neutral');
    title.textContent = iWon ? '¡Ganaste esta ronda! +1' : ((q.resolvedWinner ? q.resolvedWinner.name : 'Otro participante') + ' acertó primero');
    document.getElementById('rSub').textContent = 'Esperá la próxima pregunta.';
    return;
  }

  if (q.status === 'resolved_wrong_all') {
    const iFailed = failed;
    showScreen('result');
    document.getElementById('rIcon').textContent = '🤷';
    const title = document.getElementById('rTitle');
    title.className = 'result-title bad';
    title.textContent = 'Nadie acertó esta vez';
    let sub = '';
    if (typeof q.revealCorrectIndex === 'number' && q.options) {
      const letter = ['A', 'B', 'C'][q.revealCorrectIndex];
      sub = 'La respuesta era: ' + letter + ') ' + q.options[q.revealCorrectIndex];
    }
    document.getElementById('rSub').textContent = sub;
    return;
  }
}

function renderQuestionScreen(q) {
  showScreen('question');
  document.getElementById('qCatLabel').textContent = q.categoryLabel || '';
  document.getElementById('qText').textContent = q.text;
  const wrap = document.getElementById('qOptions');
  wrap.innerHTML = '';
  const letters = ['A', 'B', 'C'];
  (q.options || []).forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'option-btn';
    btn.innerHTML = `<span class="option-letter">${letters[idx]}</span><span>${escapeHtml(opt)}</span>`;
    btn.addEventListener('click', () => attemptAnswer(q.qId, idx));
    wrap.appendChild(btn);
  });
}

async function attemptAnswer(qId, optionIndex) {
  // deshabilita todos los botones al instante para evitar doble toque
  document.querySelectorAll('#qOptions .option-btn').forEach(b => b.disabled = true);

  const qRef = DB.ref('liveGames/' + GAME_CODE + '/question');
  const result = await qRef.transaction(current => {
    if (!current || current.qId !== qId) return; // abort: la pregunta ya cambió
    if (current.status !== 'open') return; // abort: ya está bloqueada o resuelta
    return Object.assign({}, current, {
      status: 'locked',
      lockedBy: { playerId: player.id, name: player.name, optionIndex, ts: Date.now() },
    });
  });

  if (!result.committed) {
    // perdimos la carrera; el listener onValue ya va a actualizar la pantalla
  }
}
